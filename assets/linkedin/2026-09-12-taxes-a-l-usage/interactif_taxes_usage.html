  for (const a of DATA.annees) for (const u of groupe) for (const r of barres(a, u)) m = Math.max(m, r.tot);
  return m * 1.16;
}
function seg(id, key, options) {
  const el = document.getElementById(id); el.textContent = "";
  for (const [val, label] of options) { const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(state[key] === val)); b.addEventListener("click", () => { state[key] = val; render(); }); el.appendChild(b); }
}
function controls() {
  document.getElementById("l-annee").textContent = T.annee;
  document.getElementById("l-usage").textContent = T.usage;
  document.getElementById("l-vue").textContent = T.vue;
  seg("s-annee", "annee", DATA.annees.map(a => [a, a]));
  seg("s-usage", "usage", U.map(u => [u.k, nom(u)]));
  seg("s-vue", "vue", [["graph", T.graph], ["table", T.table]]);
  const lg = document.getElementById("legend"); lg.textContent = "";
  for (const p of P) { const s = document.createElement("span"); s.style.setProperty("--c", p.c); s.textContent = nom(p); lg.appendChild(s); }
}
// Repli d'une étiquette en lignes d'au plus `n` caractères (les <tspan> de SVG
// ne se replient pas tout seuls).
function replier(texte, n) {
  const out = []; let ligne = "";
  for (const mot of texte.split(" ")) {
    if (ligne && (ligne + " " + mot).length > n) { out.push(ligne); ligne = mot; }
    else ligne = ligne ? ligne + " " + mot : mot;
  }
  if (ligne) out.push(ligne);
  return out;
}
function render() {
  controls();
  const rows = barres(state.annee, state.usage), dec = rows.length ? rows[0].d : 1;
  const top = echelle(state.usage);
  const svg = document.getElementById("svg"); svg.textContent = "";
  const W = 1080, H = 520, mg = {t:26, r:16, b:118, l:78};
  const iw = W - mg.l - mg.r, ih = H - mg.t - mg.b;
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, a, parent) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); (parent||svg).appendChild(e); return e; };
  const y = v => mg.t + ih - ih * v / top;
  const slot = iw / Math.max(rows.length, 1), xc = i => mg.l + slot*(i+0.5);
  const pas = [0.5,1,2,2.5,5,10,20,25,50,100,200,250].find(s => top/s <= 8) || 500;
  const grid = el("g", {class:"grid"}), axis = el("g", {class:"axis"});
  for (let v = 0; v <= top + 1e-9; v += pas) { el("line", {x1:mg.l, x2:W-mg.r, y1:y(v), y2:y(v), class: v === 0 ? "zero" : ""}, v === 0 ? svg : grid);
    const t = el("text", {x:mg.l-8, y:y(v)+4, "text-anchor":"end"}, axis); t.textContent = fmt(v, v < 10 && pas < 1 ? 1 : 0); }
  const ul = el("text", {x:16, y:mg.t+ih/2, transform:`rotate(-90 16 ${mg.t+ih/2})`, "text-anchor":"middle"}, el("g", {class:"ylab"}));
  ul.textContent = rows.length ? unite(rows[0]) : "";
  const tip = document.getElementById("tip");
  const showTip = (r, ev) => {
    tip.textContent = ""; const b = document.createElement("b"); b.textContent = nom(r) + " · " + state.annee; tip.appendChild(b);
    for (const p of P) { const x = r.c[p.k]; const d = document.createElement("div"); d.className = "row";
      const a = document.createElement("span"); const ii = document.createElement("i"); ii.style.setProperty("--c", p.c); a.appendChild(ii); a.appendChild(document.createTextNode(nom(p)));
      const s = document.createElement("span"); s.textContent = euro(x, dec); d.appendChild(a); d.appendChild(s); tip.appendChild(d); }
    for (const [lab, val, cls] of [[T.total, euro(r.tot, dec), "tot"],
                                   [T.prelevements, euro(r.pre, dec) + " · " + Math.round(100*r.pre/r.tot) + " %", "pre"]]) {
      const d = document.createElement("div"); d.className = "row " + cls;
      const a = document.createElement("span"); a.textContent = lab; const s = document.createElement("span"); s.textContent = val;
      d.appendChild(a); d.appendChild(s); tip.appendChild(d); }
    tip.style.display = "block"; const box = document.getElementById("chart").getBoundingClientRect();
    const px = ev.clientX - box.left, py = ev.clientY - box.top;
    tip.style.left = Math.min(px + 14, box.width - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(0, py - 10) + "px";
  };
  const bw = Math.min(120, slot*0.62);
  const largeur_etiquette = Math.max(10, Math.round(slot / 7.2));
  rows.forEach((r, i) => {
    const g = el("g"); let bas = 0;
    for (const p of P) { const x = r.c[p.k]; if (!x) continue;
      el("rect", {x:xc(i)-bw/2, y:y(bas + x), width:bw, height:Math.max(0, y(bas) - y(bas + x)), fill:p.c, stroke:"#fcfcfb", "stroke-width":0.8}, g);
      bas += x; }
    const c = el("text", {x:xc(i), y:y(r.tot) - 8}, el("g", {class:"cap"}, g)); c.textContent = euro(r.pre, dec);
    const lab = el("g", {class:"xlab"}, g); let ligne = 0;
    for (const l of replier(nom(r), largeur_etiquette)) { const t = el("text", {x:xc(i), y:mg.t+ih+20+ligne*15}, lab); t.textContent = l; ligne++; }
    for (const l of replier(hyp(r).replace(" ; ", " ; "), largeur_etiquette)) { const t = el("text", {x:xc(i), y:mg.t+ih+20+ligne*15, class:"hyp"}, lab); t.textContent = l; ligne++; }
    const hit = el("rect", {x:xc(i)-slot/2, y:mg.t, width:slot, height:ih, class:"hit"}, g);
    hit.addEventListener("pointermove", ev => showTip(r, ev)); hit.addEventListener("pointerleave", () => tip.style.display = "none");
  });
  // tableau
  const tb = document.getElementById("table"); tb.textContent = "";
  const table = document.createElement("table"); const hr = table.createTHead().insertRow();
  for (const h of [T.machine, T.hypothese, ...P.map(nom), T.total, T.prelevements, T.part]) { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); }
  const tbody = table.createTBody();
  for (const r of rows) { const tr = tbody.insertRow();
    tr.insertCell().textContent = nom(r); tr.insertCell().textContent = hyp(r);
    for (const p of P) tr.insertCell().textContent = euro(r.c[p.k], dec);
    tr.insertCell().textContent = euro(r.tot, dec); tr.insertCell().textContent = euro(r.pre, dec);
    tr.insertCell().textContent = Math.round(100*r.pre/r.tot) + " %"; }
  tb.appendChild(table);
  document.getElementById("chart").classList.toggle("hidden", state.vue !== "graph");
  tb.classList.toggle("hidden", state.vue !== "table");
  const notes = [rows.length ? unite(rows[0]) + ". " + T["n_" + state.usage] : "", T.n_general];
  if (state.annee === "2025" && state.usage === "avion_train") notes.push(T.n_2025);
  if (state.annee === "2024") notes.push(T.n_accise);
  document.getElementById("note").textContent = notes.filter(Boolean).join(" ");
}
render();
</script>
