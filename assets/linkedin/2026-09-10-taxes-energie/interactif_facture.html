<title>Ce que paie un consommateur d'énergie en France</title>
<style>
  :root { color-scheme: light; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --surf:#fcfcfb;
          --energie:#5b7d92; --reseau:#a9bcc7; --accises:#8c2c26; --tva:#e8cdbf; }
  html,body { margin:0; background:var(--surf); color:var(--ink);
    font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
  .wrap { padding: 8px 4px 4px; }
  .controls { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; margin: 0 0 8px; font-size:13px; }
  .controls label { color:var(--ink2); }
  .seg { display:inline-flex; border:1px solid var(--grid); border-radius:6px; overflow:hidden; vertical-align:middle; }
  .seg button { border:0; background:transparent; padding:4px 9px; font:inherit; color:var(--ink2); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:#e9eef2; color:var(--ink); font-weight:600; }
  .seg button + button { border-left:1px solid var(--grid); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; margin:4px 0 2px; font-size:12.5px; color:var(--ink2); }
  .legend span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; background:var(--c); }
  svg { width:100%; height:auto; display:block; }
  .grid line { stroke:var(--grid); stroke-width:1; }
  .axis text { fill:var(--muted); font-size:11.5px; }
  .xlab text { fill:var(--ink2); font-size:11px; text-anchor:middle; }
  .cap text { fill:var(--ink); font-size:12px; text-anchor:middle; font-weight:600; }
  .pct text { fill:var(--accises); font-size:11px; text-anchor:middle; }
  .seglab { font-size:11px; text-anchor:middle; pointer-events:none; }
  .bar rect { transition: y .35s ease, height .35s ease; }
  .hit { fill:transparent; cursor:default; }
  .bar:hover rect.seg-rect { filter:brightness(.93); }
  #tip { position:absolute; pointer-events:none; background:#fff; border:1px solid var(--grid); border-radius:6px;
         padding:8px 10px; font-size:12.5px; box-shadow:0 2px 8px rgba(0,0,0,.08); display:none; min-width:190px; z-index:2; }
  #tip b { display:block; margin-bottom:4px; }
  #tip .row { display:flex; justify-content:space-between; gap:12px; }
  #tip .row i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; background:var(--c); }
  #tip .tot { border-top:1px solid var(--grid); margin-top:4px; padding-top:4px; font-weight:600; }
  .note { color:var(--muted); font-size:12px; margin:6px 0 0; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; margin-top:6px; }
  th, td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--grid); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--ink2); font-weight:600; }
  .hidden { display:none; }
</style>
</head>

  const el = document.getElementById(id); el.textContent = "";

      const e2 = document.createElement("div"); e2.className = "row";
      const ea = document.createElement("span"); ea.textContent = T.eurtlab; const ev2 = document.createElement("span");
      ev2.textContent = r.eurt != null ? `${fmt(r.eurt,0)} €/t` : T.nd; e2.appendChild(ea); e2.appendChild(ev2); tip.appendChild(e2);
      tip.style.display = "block";
      const box = document.getElementById("chart").getBoundingClientRect();
      const px = (ev && ev.clientX ? ev.clientX - box.left : cx*box.width/W), py = (ev && ev.clientY ? ev.clientY - box.top : y(r.tot)*box.height/H);
      tip.style.left = Math.min(px + 14, box.width - tip.offsetWidth - 4) + "px";
      tip.style.top = Math.max(0, py - 10) + "px";
    };
    hit.addEventListener("pointermove", show); hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", () => tip.style.display = "none"); hit.addEventListener("blur", () => tip.style.display = "none");
  });
  // vue tableau
  const tb = document.getElementById("table"); tb.textContent = "";
  const table = document.createElement("table"); const thead = table.createTHead().insertRow();
  for (const h of [T.barre, ...COMP.map(c => T[c]), T.total, T.prel, T.co2, T.eurt]) { const th = document.createElement("th"); th.textContent = h; thead.appendChild(th); }
  const tbody = table.createTBody();
  for (const r of rows) { const tr = tbody.insertRow(); tr.insertCell().textContent = r.label;
    for (const c of COMP) tr.insertCell().textContent = state.unite === "pct" ? `${fmt(r.v[c],1)} %` : fmt(r.v[c],1);
    tr.insertCell().textContent = fmt(r.total,1); tr.insertCell().textContent = `${fmt(r.prel,1)} (${fmt(r.part,0)} %)`;
    tr.insertCell().textContent = r.co2 != null ? fmt(r.co2,0) : T.nd; tr.insertCell().textContent = r.eurt != null ? fmt(r.eurt,0) : T.nd; }
  tb.appendChild(table);
  document.getElementById("chart").classList.toggle("hidden", state.vue !== "graph");
  document.getElementById("legend").classList.toggle("hidden", state.vue !== "graph" || CARB);
  tb.classList.toggle("hidden", state.vue !== "table");
  document.getElementById("note").textContent = T["note_" + state.lecture]
    + (state.unite === "pct" && state.lecture !== "livre" ? T.note_pct : "")
    + (CARB ? T.note_co2 : "") + (state.unite === "eurt" && state.lecture !== "livre" ? T.note_eurt : "");
}
render();
</script>
</body>
