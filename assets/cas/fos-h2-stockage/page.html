document.querySelectorAll("[data-t]").forEach(e=>{const v=TX[e.dataset.t]; if(typeof v==="string") e.textContent=v;});
document.title = LANG==="fr" ? "Fos : hydrogène et stockage" : "Fos: hydrogen and storage";
const nf = (v,d=0)=> v.toLocaleString(LANG==="fr"?"fr-FR":"en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const css = (n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mean = a=>a.reduce((s,x)=>s+x,0)/a.length;

// ---------------------------------------------------------------- petits composants
function chips(id, options, val, onChange){
  const el=document.getElementById(id); el.innerHTML="";
  options.forEach(([v,lab])=>{const b=document.createElement("button"); b.textContent=lab; b.setAttribute("aria-pressed", v===val);
    b.onclick=()=>{[...el.children].forEach(c=>c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); onChange(v);}; el.appendChild(b);});
}
// Graphique en lignes : séries [{x:[],y:[],lo?:[],hi?:[],color,label}], marqueur vertical, info-bulle au survol.
function lineChart(id, series, o){
  const box=document.getElementById(id); box.querySelectorAll("svg,.tip,.legend").forEach(e=>e.remove());
  const W=o.w||640,H=o.h||300,m={l:46,r:16,t:12,b:38};
  const xs=series.flatMap(s=>s.x), ys=series.flatMap(s=>[...s.y,...(s.hi||[])]).filter(Number.isFinite);
  const x0=o.xmin??Math.min(...xs), x1=o.xmax??Math.max(...xs), y0=0, y1=Math.max(o.ymin1||0.1,...ys)*1.08;
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  const NS="http://www.w3.org/2000/svg", svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const add=(t,a,txt)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; svg.appendChild(e); return e;};
  const ticks=(a,b,n)=>{const st=Math.pow(10,Math.floor(Math.log10((b-a)/n))); const s=[1,2,2.5,5,10].map(k=>k*st).find(k=>(b-a)/k<=n); const r=[]; for(let v=Math.ceil(a/s)*s; v<=b+1e-9; v+=s) r.push(+v.toFixed(6)); return r;};
  ticks(y0,y1,5).forEach(v=>{add("line",{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:css("--grid")}); add("text",{x:m.l-6,y:Y(v)+4,"text-anchor":"end"},nf(v,o.yd??1));});
  (o.xticks||ticks(x0,x1,6)).forEach(v=>add("text",{x:X(v),y:H-m.b+16,"text-anchor":"middle"},(o.xfmt||(v=>nf(v)))(v)));
  add("line",{x1:m.l,x2:W-m.r,y1:Y(0),y2:Y(0),stroke:css("--muted")});
  if(o.xlabel) add("text",{x:(m.l+W-m.r)/2,y:H-4,"text-anchor":"middle"},o.xlabel);
  (o.vlines||[]).forEach(([v,lab])=>{add("line",{x1:X(v),x2:X(v),y1:m.t,y2:H-m.b,stroke:css("--muted"),"stroke-dasharray":"4 4"}); add("text",{x:X(v)-4,y:m.t+10,"text-anchor":"end"},lab);});
  series.forEach(s=>{ if(s.lo){ let d=s.x.map((x,i)=>`${i?"L":"M"}${X(x)},${Y(s.hi[i])}`).join("")+s.x.slice().reverse().map((x,i)=>`L${X(x)},${Y(s.lo[s.x.length-1-i])}`).join("")+"Z"; add("path",{d,fill:s.color,opacity:.13}); }
    add("path",{d:s.x.map((x,i)=>`${i?"L":"M"}${X(x)},${Y(s.y[i])}`).join(""),fill:"none",stroke:s.color,"stroke-width":2.2,"stroke-linejoin":"round"}); });
  if(o.marker!=null){ add("line",{x1:X(o.marker),x2:X(o.marker),y1:m.t,y2:H-m.b,stroke:css("--ink"),"stroke-width":1});
    series.forEach(s=>{const y=interp(s.x,s.y,o.marker); add("circle",{cx:X(o.marker),cy:Y(y),r:5,fill:css("--surface"),stroke:s.color,"stroke-width":2.2});}); }
  box.appendChild(svg);
  if(series.length>1){const lg=document.createElement("div"); lg.className="legend"; lg.innerHTML=series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join(""); box.appendChild(lg);}
  const tip=document.createElement("div"); tip.className="tip"; box.appendChild(tip);
  const cross=add("line",{y1:m.t,y2:H-m.b,stroke:css("--muted"),opacity:0});
  svg.addEventListener("mousemove",ev=>{const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W; const xv=Math.min(x1,Math.max(x0,x0+(px-m.l)/(W-m.l-m.r)*(x1-x0)));
    cross.setAttribute("x1",X(xv)); cross.setAttribute("x2",X(xv)); cross.setAttribute("opacity",1);
    tip.innerHTML=`<b>${(o.xfmt||(v=>nf(v)))(xv)}</b><br>`+series.map(s=>`${s.label}: ${nf(interp(s.x,s.y,xv),o.yd??2)}`).join("<br>");
    tip.style.display="block"; tip.style.left=Math.min(r.width-150,(ev.clientX-r.left)+12)+"px"; tip.style.top=((ev.clientY-r.top)-10)+"px";});
  svg.addEventListener("mouseleave",()=>{tip.style.display="none"; cross.setAttribute("opacity",0);});
}
function barChart(id, labels, vals, o){
  const box=document.getElementById(id); box.querySelectorAll("svg,.tip").forEach(e=>e.remove());
  const W=320,H=o.h||300,m={l:40,r:8,t:12,b:38}, n=vals.length, y1=Math.max(0.1,...vals)*1.12;
  const NS="http://www.w3.org/2000/svg", svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const add=(t,a,txt)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; svg.appendChild(e); return e;};
  const Y=v=>H-m.b-v/y1*(H-m.t-m.b), bw=(W-m.l-m.r)/n;
  add("line",{x1:m.l,x2:W-m.r,y1:Y(0),y2:Y(0),stroke:css("--muted")});
  const mv=mean(vals); add("line",{x1:m.l,x2:W-m.r,y1:Y(mv),y2:Y(mv),stroke:css("--ink"),"stroke-dasharray":"3 3"}); add("text",{x:W-m.r,y:Y(mv)-4,"text-anchor":"end"},TX.moyenne);
  const tip=document.createElement("div"); tip.className="tip"; box.appendChild(tip);
  vals.forEach((v,i)=>{const x=m.l+i*bw+2, h=Math.max(0,Y(0)-Y(Math.max(v,0)));
    const r=add("rect",{x,y:Y(Math.max(v,0)),width:bw-4,height:h,rx:3,fill:o.color});
    add("text",{x:x+(bw-4)/2,y:H-m.b+14,"text-anchor":"middle","font-size":10},labels[i]);
    const hit=add("rect",{x:m.l+i*bw,y:m.t,width:bw,height:H-m.t-m.b,fill:"transparent"});
    hit.addEventListener("mousemove",ev=>{const b=svg.getBoundingClientRect(); tip.innerHTML=`<b>${TX.annee} ${o.full[i]}</b><br>${nf(v,2)}`; tip.style.display="block"; tip.style.left=Math.min(b.width-110,(ev.clientX-b.left)+10)+"px"; tip.style.top=((ev.clientY-b.top)-10)+"px";});
    hit.addEventListener("mouseleave",()=>tip.style.display="none");});
  add("text",{x:(m.l+W-m.r)/2,y:H-4,"text-anchor":"middle"},TX.annee);
  box.appendChild(svg);
}
function interp(xs,ys,x){ if(x<=xs[0]) return ys[0]; for(let i=1;i<xs.length;i++){ if(x<=xs[i]){const t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]);} } return ys[ys.length-1]; }

// ---------------------------------------------------------------- section 1
const S=D.S, st1={capex:1350,gaz:30,dem:S.demandes[2],vol:200};
chips("gaz1", S.gaz.map(g=>[g, LANG==="fr"?`${g} €/MWh`:`€${g}/MWh`]), st1.gaz, v=>{st1.gaz=v; draw1();});
chips("dem", S.demandes.map((d,i)=>[d, nf(d,d%1?1:0)+" "+TX.kt+(i===2?TX.fos:i===4?TX.acier:"")]), st1.dem, v=>{st1.dem=v; draw1();});
chips("vol", S.volumes.map(v=>[v, nf(v)+" GWh"]), st1.vol, v=>{st1.vol=v; draw1();});
document.getElementById("capex").addEventListener("input",e=>{st1.capex=+e.target.value; draw1();});
function draw1(){
  document.getElementById("capex_o").textContent = (LANG==="fr"? nf(st1.capex)+" €/kW" : "€"+nf(st1.capex)+"/kW");
  const L=S.v[`${st1.gaz}|${+st1.dem}|${st1.vol}`];
  const ny=L[0].kg.length, at=k=>Array.from({length:ny},(_,a)=>interp(S.capex,L.map(r=>r[k][a]),st1.capex));
  const kg=at("kg"), part=at("part");
  const mk=mean(kg), mw=+st1.dem*1e6*mk/1e6;
  document.getElementById("t_kg").textContent=TX.fmtkg(mk);
  document.getElementById("t_part").textContent=nf(100*mean(part))+" %";
  document.getElementById("t_meur").textContent=nf(mw);
  document.getElementById("t_range").textContent=nf(Math.min(...kg),2)+" – "+nf(Math.max(...kg),2);
  const col={15:css("--g15"),30:css("--g30"),65:css("--g65")};
  const series=S.gaz.map(g=>{const R=S.v[`${g}|${+st1.dem}|${st1.vol}`]; return {x:S.capex,y:R.map(r=>mean(r.kg)),
    lo:g===st1.gaz?R.map(r=>Math.min(...r.kg)):null, hi:g===st1.gaz?R.map(r=>Math.max(...r.kg)):null, color:col[g], label:(LANG==="fr"?`gaz ${g} €/MWh`:`gas €${g}/MWh`)};});
  lineChart("c1",series,{marker:st1.capex,xmin:200,xmax:2000,xticks:[200,600,1000,1400,1800],xlabel:LANG==="fr"?"€/kW électrique":"€/kW electric",yd:2});
  barChart("c2",D.annees.map(a=>a.slice(2)),kg,{color:col[st1.gaz],full:D.annees});
}
draw1();

// ---------------------------------------------------------------- section 2
const Hh=D.H, st2={niv:"rte_ref",gaz:30,i:Hh.parts.indexOf(Hh.sans_reformeur)};
document.getElementById("phi").max=Hh.parts.length-1; document.getElementById("phi").value=st2.i;
chips("niv", Hh.niveaux.map(([n,c])=>[n, LANG==="fr"?nf(c)+" €/kW":"€"+nf(c)+"/kW"]), st2.niv, v=>{st2.niv=v; draw2();});
chips("gaz2", Hh.gaz.map(g=>[g, LANG==="fr"?`${g} €/MWh`:`€${g}/MWh`]), st2.gaz, v=>{st2.gaz=v; draw2();});
document.getElementById("phi").addEventListener("input",e=>{st2.i=+e.target.value; draw2();});
function draw2(){
  const p=Hh.parts, f=p[st2.i];
  document.getElementById("phi_o").textContent=nf(100*f,f*100%1?1:0)+" %";
  const S0=Hh.h[`${st2.niv}|${st2.gaz}|0`], S1=Hh.h[`${st2.niv}|${st2.gaz}|1`];
  const m0=S0.map(r=>mean(r.ht)), m1=S1.map(r=>mean(r.ht)), e1=S1.map(r=>mean(r.ev));
  document.getElementById("u_sans").textContent=nf(m0[st2.i]);
  document.getElementById("u_avec").textContent=nf(m1[st2.i]);
  document.getElementById("u_t").textContent= e1[st2.i]>1 ? nf(m1[st2.i]*1e3/e1[st2.i]) : "—";
  const de = st2.i>0 ? e1[st2.i]-e1[st2.i-1] : 0;
  document.getElementById("u_marg").textContent= de>1 ? nf((m1[st2.i]-m1[st2.i-1])*1e3/de) : "—";
  const x=p.map(v=>100*v);
  lineChart("c3",[
    {x,y:m0,color:css("--warm"),label:TX.sans},
    {x,y:m1,color:css("--accent"),label:TX.avec}],
    {marker:100*f,xmin:0,xmax:100,xticks:[0,20,40,60,80,100],xfmt:v=>nf(v)+" %",vlines:[[100*Hh.sans_reformeur,TX.reformeur]],yd:0,w:document.getElementById("c3").clientWidth>700?960:640,h:340});
}
draw2();

// ---------------------------------------------------------------- hypothèses, pistes, pied
document.querySelector("#hyp tbody").innerHTML=D.hyp.map(h=>`<tr><td>${h.nom}</td><td>${h.valeur}</td><td>${h.unite}</td><td>${h.source}</td><td>${h.statut}</td></tr>`).join("");
document.getElementById("cx").innerHTML=TX.cx.map(c=>`<li>${c}</li>`).join("");
document.getElementById("pied").textContent=TX.pied(D.meta);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{draw1();draw2();});
</script>
