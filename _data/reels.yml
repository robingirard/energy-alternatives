# Les vidéos courtes, une entrée par épisode, dans l'ordre où la page les montre :
# par filière, l'arc du procédé puis la série « Économie ».
#
# Rendue par `reels.md` (/reels.html) et `en/reels.md` (/en/reels.html). Ce n'est
# volontairement PAS une collection Jekyll comme `_linkedin/` : une collection sert
# quand chaque épisode mérite sa propre page. Tant que six épisodes tiennent sur une
# page, un fichier de données suffit — et le jour où il en faudra une par épisode,
# c'est ce fichier qui nourrira le générateur.
#
# `youtube` : l'IDENTIFIANT de la vidéo, pas son URL (`dQw4w9WgXcQ`, pas
# `youtube.com/watch?v=…`). La page en fabrique le lecteur encapsulé et le lien. Tant
# qu'il est vide, elle affiche la couverture et « bientôt en ligne » à la place.
#
# `code` : le chemin de l'épisode dans le dépôt public
# git.persee.minesparis.psl.eu/energy-alternatives/reels. Vide = lien vers la racine.
#
# Pas de champ Instagram par épisode : le lien vers le compte est donné une fois, en
# tête de page. Un lien par vidéo n'apporterait rien — on vient d'Instagram, on n'y
# retourne pas.
#
# `serie` et `numero` : deux formes. Un **arc fermé** porte son total (« Acier »,
# « 3/6 » : les six reels du procédé, de la fabrication à la sobriété). Une **série
# parallèle**, reprise filière après filière, se compte dans son secteur
# (« Acier · Économie », « 1/2 ») — sans quoi tout total écrit aujourd'hui serait
# faux le jour où une filière s'ajoute. Voir la règle 1.10 de la charte.
#
# `domaine` et `filiere` : les deux niveaux de la page. Le domaine (« Industrie », un
# jour « Transport », « Bâtiment », « Système électrique ») n'apparaît en titre que
# lorsqu'il y en a plus d'un ; la filière (« Acier », « Ciment »…) fait un bloc, dans
# lequel les épisodes se lisent **dans l'ordre de ce fichier** : l'arc du procédé de 1
# à N, puis la série « Économie ». C'est le découpage des playlists YouTube. Les
# variantes `_en` servent la page anglaise ; à défaut, le français est repris.
#
# ATTENTION : tout texte contenant un « : » doit passer par un scalaire replié (`>-`),
# sinon YAML le lit comme une clé et la construction du site échoue. Les sources en
# contiennent presque toutes, d'où la forme ci-dessous.

- id: acier-1
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier
  serie_en: Steel
  numero: 1/6
  duree: 1 min 51
  couverture: /assets/reels/acier_1.jpg
  titre: Comment on fabrique de l'acier
  titre_en: How steel is made
  accroche: >-
    Une des plus grandes usines de France, six cent soixante-quinze terrains de
    football, trois mille personnes — et une seule chose à faire : arracher son
    oxygène au minerai de fer. La cokerie, le haut fourneau, le convertisseur, le
    laminoir, jusqu'à la bobine.
  accroche_en: >-
    One of France's largest industrial sites, six hundred and seventy-five football
    pitches, three thousand people — and a single job to do: strip the oxygen out of
    iron ore. From the coke ovens to the blast furnace, the converter, the rolling
    mill and the coil.
  youtube: tfdNDqzkcLU
  code:
  sources:
    - >-
      Températures, durées et teneurs en carbone — cokerie à 1100 °C pendant 16 à 20 h,
      vent chaud à 1200 °C, creuset à 1500 °C, fonte à 4,5 % de carbone ramenée à 0,05 %
      au convertisseur — note de procédés industriels, valeurs d'ingénierie 2025.
    - >-
      6,8 Mt d'acier par an à Dunkerque — ArcelorMittal, projet de décarbonation ;
      14 Mt de demande intermédiaire française — France Stratégie, « Coûts d'abattement
      — Acier », octobre 2024.
    - >-
      Emprise de 482 ha mesurée sur OpenStreetMap, soit 675 terrains FIFA ; ArcelorMittal
      annonce 550 ha, soit 770. Vue aérienne — orthophoto IGN / Géoplateforme (Licence
      Ouverte) et emprise OpenStreetMap (ODbL).
    - >-
      Brame de 150 à 350 mm, bande de 1,25 à 13 mm en sortie, bobinage jusqu'à 20 m/s —
      Techniques de l'Ingénieur, ArcelorMittal Belgique, IspatGuru.
    - >-
      Le nombre de coulées par jour est le seul chiffre calculé et non cité — 6,8 Mt/an
      sur trois hauts fourneaux, à 500 t la coulée, donne une dizaine de coulées par jour
      et par four. Il dépend du nombre de fours en campagne.
  licence: >-
    Photographies d'atelier issues de Wikimedia Commons, auteur et licence crédités sur
    chaque image ; onze d'entre elles étant sous CC BY-SA, cette vidéo est elle-même
    diffusée sous licence CC BY-SA 4.0.

- id: acier-2
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier
  serie_en: Steel
  numero: 2/6
  duree: 1 min 57
  couverture: /assets/reels/acier_2.jpg
  titre: D'où vient le CO₂ de l'acier
  titre_en: Where steel's CO₂ comes from
  accroche: >-
    Deux tonnes dix de CO₂ par tonne d'acier. On descend la ligne atelier par atelier
    en faisant monter le compteur, et on découvre que plus de la moitié vient d'un
    carbone qui n'est pas là pour chauffer, mais pour prendre l'oxygène du minerai.
  accroche_en: >-
    Two point one tonnes of CO₂ per tonne of steel. We walk down the line workshop by
    workshop with a running counter, and find that more than half comes from carbon
    that is not there to heat anything, but to take the oxygen out of the ore.
  youtube: p5-1Ptw2G_c
  code:
  sources:
    - >-
      La cascade, en tCO₂ par tonne d'acier brut, périmètre cradle-to-gate, amont du
      combustible compris — mines et fret 0,25, cokerie 0,20, agglomération 0,15,
      haut fourneau 1,20, convertisseur 0,20, coulée et laminoir 0,10, soit 2,10.
    - >-
      Décomposition du total — chimie de réduction 1,30, combustibles 0,55, amont 0,25.
      « Un quart du problème » porte sur le combustible seul (0,55 / 2,10 = 26 %), pas
      sur combustible + amont (0,80, soit 38 %).
    - >-
      Réaction citée — Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂, et 300 à 350 kg de coke par tonne
      de fonte.
    - >-
      Le four électrique de Dunkerque — 2 Mt de capacité, mise en service annoncée pour
      2029-2030, 0,6 tCO₂/t contre 2,10, arrêt définitif d'un haut fourneau.
      ArcelorMittal France, communiqué du 10 février 2026.
  licence:

- id: acier-3
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier
  serie_en: Steel
  numero: 3/6
  duree: 1 min 59
  couverture: /assets/reels/acier_3.jpg
  titre: La ferraille, et pourquoi le recyclage plafonne
  titre_en: Scrap, and why recycling hits a ceiling
  accroche: >-
    Refondre de la ferraille émet 0,16 tonne de CO₂ par tonne d'acier, contre 2,10 par
    le haut fourneau. Alors pourquoi ne pas tout faire comme ça ? Parce que la ferraille
    vient du passé, et que le passé était plus petit — et parce qu'elle traîne du
    cuivre, qu'on ne sait pas retirer d'un bain d'acier.
  accroche_en: >-
    Remelting scrap emits 0.16 tonnes of CO₂ per tonne of steel, against 2.10 by the
    blast furnace route. So why not do it everywhere? Because scrap comes from the past,
    and the past was smaller — and because it carries copper, which cannot be taken back
    out of a steel melt.
  youtube: S5OdDWIf7iM
  code:
  sources:
    - >-
      Émissions — 0,16 tCO₂/t pour le four à arc sur ferraille et 2,10 pour la route
      intégrée, avec une électricité sans émissions des deux côtés ; sur le réseau UE-27
      à 240 gCO₂/kWh, 0,32 et 2,24. Périmètre cradle-to-gate, amont du combustible
      compris.
    - >-
      Production mondiale d'acier brut — 189 Mt en 1950, 719 en 1985, 1 887 en 2024
      (worldsteel, World Steel in Figures 2026). Le 38 % est le rapport 719 / 1 887,
      c'est-à-dire l'acier produit en 1985 rapporté à la demande d'aujourd'hui, donc une
      borne haute ; le 30 % est le gisement effectivement disponible, plus bas parce
      qu'une partie de cet acier est encore en service.
    - >-
      Taux de collecte de 80 à 90 % — ordre de grandeur du secteur, arrondi vers le bas.
    - >-
      Part du four à arc par pays en 2020 — Chine 9 %, Union européenne 44 %, Inde 56 %,
      Japon 25 %, États-Unis 71 %, Russie 33 %. JRC d'après World Steel Association,
      2021 ; graphique redessiné à partir des valeurs. Ces parts ont bougé depuis,
      surtout en Chine.
    - >-
      Le cuivre est un élément résiduel, qu'on ne sait pas retirer du bain une fois
      qu'il y est, contrairement au carbone, au silicium ou au phosphore que
      l'oxydation emporte. Ce que la ferraille en porte, en pourcentage de la masse :
      chutes de l'aciérie 0,021, emballages 0,05, ferraille lourde de démolition 0,234,
      voitures broyées 0,23 — Olivier, Becker et Nylén, KIMAB, 2006. Ce que le produit
      tolère : armatures de béton 0,40, barres, tubes et fil 0,10, tôle d'automobile et
      emboutissage profond 0,06 — Daehn, Cabrera Serrenho et Allwood, Environmental
      Science & Technology 51(11), 2017, et Schrade et al., 2006. Une voiture broyée
      porte donc près de quatre fois ce qu'une tôle d'automobile tolère, et seules les
      armatures acceptent une telle teneur.
    - >-
      Le gisement, et la part qui grossit : 650 Mt de ferraille refondues chaque année
      pour faire de l'acier, sur 1 869 Mt d'acier brut, dont environ 400 Mt de fin de
      vie en 2019 — et 600 attendues en 2030, 900 en 2050. Durée de vie moyenne d'un
      produit en acier : 40 ans, de quelques semaines pour un emballage à cent ans pour
      un bâtiment. worldsteel, « Scrap use in the steel industry », mai 2021.
    - >-
      Cette source dit plus que le reel n'en retient — le cuivre reste gérable à
      l'échelle mondiale jusque vers 2050, mais à condition d'un commerce de ferraille
      parfaitement coordonné et d'une dilution massive, stratégie qu'elle juge
      « increasingly impractical ».
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; la couverture reprend le grappin de Visitor7, CC BY-SA 3.0. Huit des dix
    étant sous CC BY-SA, cette vidéo est elle-même diffusée sous licence CC BY-SA 4.0.

- id: acier-4
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier
  serie_en: Steel
  numero: 4/6
  duree: 1 min 51
  couverture: /assets/reels/acier_4.jpg
  titre: L'hydrogène, et le four qui tourne déjà
  titre_en: Hydrogen, and the furnace that already runs
  accroche: >-
    Il existe déjà une autre façon de faire du fer, et elle n'a rien d'expérimental :
    141 millions de tonnes en 2024, sept pour cent de l'acier mondial. On ne fond plus
    le minerai, on le réduit à l'état solide — sauf que le gaz qui le réduit est du
    méthane. Changer ce gaz suffit à faire disparaître le CO₂ de réduction, à une
    condition : l'électricité.
  accroche_en: >-
    There is already another way to make iron, and nothing experimental about it:
    141 million tonnes in 2024, seven percent of world steel. The ore is no longer
    melted but reduced in the solid state — except that the gas doing the reducing is
    methane. Changing that gas is enough to make the reduction CO₂ disappear, on one
    condition: the electricity.
  youtube: X9WMqBYC0vA
  code:
  sources:
    - >-
      Fer préréduit — 140,8 Mt en 2024, un record, contre 135,7 en 2023 (Midrex).
      Rapporté aux 1 887 Mt d'acier brut mondial, cela fait 7,5 %. Par pays — Inde
      54,7 Mt, Iran 34,7, Russie 8,0, Arabie saoudite 6,6, Égypte 6,4.
    - >-
      La part au gaz est calculée, et c'est le seul chiffre du reel qui le soit — Midrex
      publie 76,2 Mt pour ses usines, « 54,1 % du total » et « 80,1 % du fer sorti de
      fours à cuve », donc 95,1 Mt de cuves, soit 68 % des 140,8. Le tiers restant,
      environ 46 Mt, est au charbon, et l'Inde en fait presque tout : 54,7 Mt dont
      environ 80 % en fours rotatifs au charbon.
    - >-
      Émissions, en tCO₂ par tonne d'acier brut — réduction directe au gaz naturel plus
      four à arc, 0,90 ; à l'hydrogène, 0,07 avec une électricité sans émissions et 0,91
      sur le réseau UE-27 à 240 gCO₂/kWh ; route intégrée, 2,10. Le facteur trente est
      2,10 / 0,07.
    - >-
      Électricité — environ 3,5 MWh par tonne d'acier pour la route hydrogène, dont 2,6
      pour l'électrolyse et 0,6 pour le four à arc. Sur le réseau français (56 gCO₂/kWh)
      la route retombe à 0,27 ; sur la moyenne mondiale (480 g) elle monte à 1,75, soit
      plus que le gaz naturel. C'est pourquoi le reel dit « bas carbone » et non
      « électrique ».
    - >-
      Le mélange progressif — le gaz réducteur d'une cuve au gaz naturel est déjà à
      55 mol % d'hydrogène ; jusqu'à 30 % du gaz naturel peut être remplacé sans
      modifier les équipements, et au-delà les modifications ne touchent ni le four de
      réduction, ni les scrubbers, ni le reformeur. Midrex Technologies, « MIDREX NG
      with H2 Addition ». C'est un document d'équipementier, à lire comme des
      spécifications de procédé et non comme une évaluation économique.
  licence: >-
    Deux photographies issues de Wikimedia Commons, toutes deux sous CC BY-SA 3.0 ;
    la couverture reprend l'une d'elles, le four à arc de GMH official. Cette vidéo
    est donc diffusée sous licence CC BY-SA 4.0.

- id: acier-5
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier
  serie_en: Steel
  numero: 5/6
  duree: 2 min 01
  couverture: /assets/reels/acier_5.jpg
  titre: L'électrolyse, ou supprimer le réducteur
  titre_en: Electrolysis, or doing away with the reductant
  accroche: >-
    Le haut fourneau réduit le minerai avec du carbone, la réduction directe avec de
    l'hydrogène. Il existe une troisième voie : ne rien mettre du tout. C'est ce qu'on
    fait pour l'aluminium depuis 1886, et deux familles de cellules le font pour le fer —
    à 1600 °C et à 110 °C. Même bilan carbone que l'hydrogène, une conversion au lieu de
    deux, et le stade pilote pour limite.
  accroche_en: >-
    The blast furnace reduces ore with carbon, direct reduction with hydrogen. There is a
    third way: putting nothing in at all. It is what aluminium has done since 1886, and
    two families of cells now do it for iron — at 1600 °C and at 110 °C. Same carbon
    balance as hydrogen, one conversion instead of two, and pilot scale as the limit.
  youtube: Mu9MRtDGcR4
  code:
  sources:
    - >-
      Réaction commune, sans carbone — 2 Fe₂O₃ → 4 Fe + 3 O₂ ; le sous-produit est de
      l'oxygène. Le 0,07 tCO₂/t résiduel est le carbone de carburation : un acier
      contient du carbone par définition.
    - >-
      Les trois routes électriques, en tCO₂ par tonne d'acier brut et en MWh par tonne —
      électrolyse en oxyde fondu 0,07 et 4,20 MWh (1,08 sur le réseau UE-27) ;
      électrogagnage alcalin 0,07 et 3,60 MWh (0,93) ; réduction directe à l'hydrogène
      0,07 et 3,50 MWh (0,91). Le réseau UE-27 est pris à 240 gCO₂/kWh en 2023, valeur
      périssable qui baisse.
    - >-
      Le minimum thermodynamique de la réduction du fer est d'environ 2,6 MWh par tonne.
      L'oxyde fondu à 4,2 et l'électrogagnage à 3,6 en sont à un facteur 1,4 à 1,6, quand
      les 3,5 MWh de la route hydrogène incluent déjà les pertes de l'électrolyseur.
      C'est là que se joue la marge de progrès.
    - >-
      Boston Metal (Woburn, Massachusetts), électrolyse en oxyde fondu — cellule
      industrielle mise en service en mars 2025, environ une tonne d'acier sur la plus
      longue campagne. En mai 2026 la société lève 75 M$ et recentre ses moyens sur les
      métaux critiques, ce que la vidéo dit : un spectateur qui va vérifier le trouve
      en trois clics, et il vaut mieux qu'il l'apprenne de nous.
    - >-
      Volteron (ArcelorMittal et John Cockerill), électrogagnage alcalin, suite
      industrielle du projet européen SIDERWIN achevé — annoncé le 14 juin 2023, une
      première usine de 40 000 à 80 000 t/an de plaques de fer visant 2027, puis 300 000 t
      à 1 Mt/an. Un pilote a été mis en service en avril 2025. Le reel s'arrête au
      pilote, et pas à la date de 2027 : ni le site ni la décision d'investissement ne
      sont publics.
    - >-
      Cinq cents tonnes par coulée de haut fourneau, contre quelques tonnes par jour pour
      une cellule pilote. Ces routes ne sont pas équivalentes en disponibilité, et c'est
      tout le propos de la dernière phrase.
  licence: >-
    Aucune photographie dans la vidéo, seulement une planche dessinée pour la série. La
    couverture montre une série de cuves d'électrolyse d'aluminium (Albasmelter,
    CC BY-SA 4.0) : l'acier n'en a pas encore à cette échelle, et c'est l'argument même
    de l'épisode.

- id: acier-6
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier
  serie_en: Steel
  numero: 6/6
  duree: 2 min 06
  couverture: /assets/reels/acier_6.jpg
  titre: Sobriété ou technologie ?
  titre_en: Sufficiency or technology?
  accroche: >-
    Une objection revient toujours : l'acier à l'hydrogène consommerait trop
    d'électricité. Elle est sérieuse, et le chiffre — 4 000 TWh par an, la production
    électrique des États-Unis — est juste. Ce qui manque, c'est ce qu'on met en face. Et
    au bout du calcul de la sobriété, il resterait encore plus d'un milliard et demi de
    tonnes de CO₂ par an.
  accroche_en: >-
    One objection keeps coming back: hydrogen steel would use too much electricity. It
    is a serious one, and the figure — 4,000 TWh a year, the electricity output of the
    United States — is right. What is missing is what you put on the other side of the
    scale. And at the end of the sufficiency arithmetic, more than one and a half
    billion tonnes of CO₂ a year would still be left.
  youtube: zPVpRUxsLj4
  code:
  sources:
    - >-
      Les 4 000 TWh par an et l'équivalence avec la production électrique des États-Unis
      sont les chiffres de l'auteur discuté, repris sans être contestés. Le reel ne
      discute pas le calcul, il discute ce qu'on met en face.
    - >-
      La thèse est citée dans ses deux moitiés, et la première compte autant que la
      seconde : il ne s'agit pas seulement de consommer moins d'acier, mais de ne pas
      miser sur les technologies de décarbonation et, à la place, d'en consommer moins.
      C'est ce premier terme que la vidéo discute — renvoyer la décarbonation à la
      seule sobriété, c'est retarder ce qui marche déjà.
    - >-
      L'acier — 3,5 GtCO₂ par an, près de 10 % des émissions mondiales, et environ 14 %
      du charbon consommé dans le monde. La sidérurgie a consommé 1,14 Gt de charbon en
      2022 (755 Mt de charbon à coke et 389 Mt de charbon vapeur) sur les 8,5 Gt
      mondiales. Global Efficiency Intelligence, « Steel and Coal » ; AIE pour le total.
    - >-
      Le billet de 2024 disait « un quart du charbon consommé dans le monde, plus de
      2 Gt par an » : c'était faux des deux côtés, et il est corrigé. L'erreur venait
      probablement du tonnage d'acier, environ 2 Gt par an, cité plus loin dans le même
      billet et reporté par mégarde sur le charbon.
    - >-
      Les deux dénominateurs des graphiques de mise en perspective sont des hypothèses
      de cadrage et non des valeurs citées — 37 GtCO₂ d'émissions mondiales et
      45 000 TWh d'électricité bas carbone en 2050. Ce sont les deux seules valeurs de
      la série dans ce cas.
    - >-
      L'acier des éoliennes — entre 15 et 25 Mt par an. L'écart vient de l'intensité
      matière retenue pour l'éolien terrestre ; la conclusion tient dans les deux cas,
      puisqu'on compare à 1 900 Mt produites.
    - >-
      Énergie primaire mondiale depuis 1800 — Our World in Data, méthode de
      substitution. La biomasse traditionnelle passe de 5 556 TWh en 1800 à 11 111 en
      2024, elle a doublé, pendant que le charbon passait de 97 à 45 931, rejoint par le
      pétrole puis le gaz. Rien n'a remplacé rien.
    - >-
      Fer préréduit — 140,8 Mt en 2024 (Midrex). Le reel dit « en 2024 » et non « l'an
      dernier », la statistique de 2025 n'étant pas encore publiée.
  licence: >-
    Aucune photographie dans la vidéo ; les graphiques sont redessinés aux couleurs de
    la série à partir des valeurs, et la série Our World in Data est citée sur la figure.
    La couverture est sous CC0 (Daniel Olah).

- id: acier-eco-1
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier · Économie
  serie_en: Steel · Economics
  numero: 1/2
  duree: 1 min 30
  couverture: /assets/reels/acier_eco_1.jpg
  titre: Décarboner l'acier, ça coûte combien ?
  titre_en: What does decarbonising steel cost?
  accroche: >-
    Les six vidéos précédentes ont montré comment on décarbone l'acier. Aucune n'a dit
    ce que ça coûte — et c'est pourtant ce qui décide de ce qui se construit. Cinq
    routes, de 117 à 392 € la tonne de CO₂ évitée, quand le quota en vaut 80 — et
    l'hydrogène tient les deux extrêmes, selon qu'il est importé ou produit en France.
    D'où la décision de Dunkerque : la brique la moins chère, et pas un pas de plus.
  accroche_en: >-
    The previous six videos showed how steel can be decarbonised. None said what it
    costs — and cost is what decides what actually gets built. Five routes, €117 to
    €392 per tonne of CO₂ avoided, against an allowance price of €80 — with hydrogen
    at both ends, depending on whether it is imported or made in France. Hence the
    Dunkirk decision: the cheapest brick, and not one step further.
  youtube:
  code:
  sources:
    - >-
      Coûts d'abattement — France Stratégie, « Les coûts d'abattement — Partie 7 :
      Acier », rapport de la commission présidée par Alain Quinet, octobre 2024.
      Réduction directe au gaz naturel 75 à 123 €/tCO₂ évitée pour 40 % d'émissions
      en moins ; avec capture et stockage 161 € pour 65 % ; hydrogène produit à
      l'étranger 117 € pour 65 % ; électrolyse directe du minerai 192 €. Horizon 2030.
    - >-
      La cinquième barre est la seule qui ne vienne pas du tableau 1. Le rapport ne
      chiffre pas la réduction directe à l'hydrogène produit en France, qu'il dit
      « fortement dépendante de la mise en œuvre » : son hypothèse centrale est un
      hydrogène à 5 €/kg, et dans le cas qui lui est le plus favorable — 3 €/kg, gaz
      à 50 €/MWh — le coût d'abattement ressort à 392 €/tCO₂. C'est cette valeur qui
      est à l'écran, sans pourcentage de réduction à côté, faute d'être publiée.
    - >-
      La valeur de référence du carbone est de 295 €/tCO₂ en 2030 (France Stratégie,
      rapport Quinet actualisé), quand le quota européen s'échange autour de 80 € :
      c'est l'écart qui explique qu'aucune route ne soit rentable au prix du marché.
    - >-
      Dunkerque — four électrique confirmé en février 2026, 1,3 Md€, 2 Mt/an, mise en
      service visée en 2029, ≈ 0,6 tCO₂ par tonne d'acier sur un mix ferraille, fer
      préréduit et fonte. Le projet de réduction directe à l'hydrogène est suspendu.
  licence: >-
    Vue aérienne : orthophoto IGN / Géoplateforme (Licence Ouverte) et emprise
    OpenStreetMap (ODbL). Aucune photographie sous CC BY-SA dans cette vidéo, qui est
    donc diffusée sous licence CC BY 4.0 ; sa couverture reprend la même vue aérienne.

- id: acier-eco-2
  domaine: Industrie
  domaine_en: Industry
  filiere: Acier
  filiere_en: Steel
  serie: Acier · Économie
  serie_en: Steel · Economics
  numero: 2/2
  duree: 1 min 29
  couverture: /assets/reels/acier_eco_2.jpg
  titre: La règle qui manque
  titre_en: The missing rule
  accroche: >-
    Aucune route de décarbonation de l'acier n'est rentable au prix du quota. Alors
    qu'est-ce qui ferait bouger l'industriel quand même ? Le bâtiment a sa RE2020 :
    une règle sur le carbone du produit fini. Pour une voiture, la même exigence
    coûterait quelques dixièmes de pour cent du prix.
  accroche_en: >-
    No steel decarbonisation route pays for itself at the allowance price. So what
    would make an industrial firm move anyway? Buildings have their own rule on the
    embodied carbon of the finished product. For a car, the same requirement would
    cost a few tenths of a percent of the price.
  youtube:
  code:
  sources:
    - >-
      Les coûts d'abattement et le prix du quota sont ceux de l'épisode précédent —
      France Stratégie, octobre 2024.
    - >-
      La RE2020 fixe un seuil de carbone sur le bâtiment fini, pas sur chaque
      matériau : c'est l'instrument dont le reel compare le principe à ce qui manque
      pour l'acier.
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; la couverture reprend l'atelier de carrosserie de l'usine BMW de Leipzig
    (BMW Werk Leipzig, CC BY-SA 2.0 de). Les deux clichés étant sous CC BY-SA, cette
    vidéo est elle-même diffusée sous licence CC BY-SA 4.0.

- id: ciment-1
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  serie: Ciment
  serie_en: Cement
  numero: 1/4
  duree: 1 min 43
  couverture: /assets/reels/ciment_1.jpg
  titre: Comment on fabrique du ciment
  titre_en: How cement is made
  accroche: >-
    Le calcaire est partout, et le ciment, lourd et bon marché, ne voyage pas : d'où
    une vingtaine de cimenteries en France, près des carrières et des villes. À
    Lumbres, on suit la ligne organe par organe, de la carrière aux silos.
  accroche_en: >-
    Limestone is everywhere, and cement, heavy and cheap, does not travel: hence some
    twenty cement plants in France, close to quarries and towns. In Lumbres, we follow
    the line machine by machine, from the quarry to the silos.
  youtube: bMlVfX3H8tw
  code:
  sources:
    - >-
      Calcaire à 80 % de la matière crue, précalcinateur à ≈ 900 °C avec 60 % du
      combustible, four rotatif de 50 à 70 m, brûleur principal à 1450 °C — note de
      procédés industriels, valeurs d'ingénierie 2025.
    - >-
      Les 22 fours à clinker en service en 2023 — registre IndustryForge (Zenodo
      10.5281/zenodo.21979417, CC BY 4.0), recoupé avec le Global Cement and Concrete
      Tracker ; 13,9 Mt de ciment en 2024 et 150 km de livraison en moyenne — France
      Ciment et SFIC.
    - >-
      Lumbres — 800 000 t de ciment par an, 135 salariés (L'Usine Nouvelle, 2024) ;
      emprise de 100 ha mesurée sur OpenStreetMap, soit 140 terrains de football.
  licence: >-
    Photographies d'atelier issues de Wikimedia Commons, auteur et licence crédités sur
    chaque image ; carte et vue aérienne IGN / Géoplateforme (Licence Ouverte) et
    OpenStreetMap (ODbL). La couverture reprend la vue aérienne de Neubeckum (Dietmar
    Rabich, CC BY-SA 4.0). Quatre clichés étant sous CC BY-SA, cette vidéo est
    diffusée sous licence CC BY-SA 4.0.

- id: ciment-2
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  serie: Ciment
  serie_en: Cement
  numero: 2/4
  duree: 2 min 01
  couverture: /assets/reels/ciment_2.jpg
  titre: D'où vient le CO₂ du ciment
  titre_en: Where cement's CO₂ comes from
  accroche: >-
    620 kilos de CO₂ par tonne de ciment. On suit la ligne en faisant monter le
    compteur, et le plus gros ne vient pas du feu : 62 % sortent de la pierre
    elle-même, quand le calcaire se décompose.
  accroche_en: >-
    620 kilos of CO₂ per tonne of cement. We follow the line with a running counter,
    and the bulk does not come from the fire: 62% comes out of the stone itself, as
    the limestone breaks down.
  youtube: kN8CCUxos3Q
  code:
  sources:
    - >-
      La cascade, en tCO₂ par tonne de clinker — décarbonatation 0,52 (CaCO₃ → CaO +
      CO₂), combustion 0,31, soit 0,83, dont 62 % sans combustible ; × 0,75 de clinker
      dans le ciment, 0,62 tCO₂ par tonne de ciment. Valeurs d'ingénierie 2025,
      émissions directes.
    - >-
      Un four moderne consomme 3,2 à 3,7 GJ par tonne de clinker, à 15 % de son
      minimum thermodynamique.
    - >-
      Lumbres, programme K6 (Eqiom et Air Liquide) — près de 8 Mt de CO₂ à capter sur
      les dix premières années, Fonds européen d'innovation (150 M€) ; Air Liquide,
      1er avril 2022. Le captage était annoncé pour 2028 par Eqiom en 2022 ;
      l'Autorité environnementale dit « à l'horizon 2027-2028 » (2024).
  licence: >-
    Photographies d'atelier issues de Wikimedia Commons, auteur et licence crédités sur
    chaque image ; vue aérienne IGN / Géoplateforme (Licence Ouverte) et OpenStreetMap
    (ODbL). La couverture reprend le fond de la carrière de Deuna (ErwinMeier, CC BY-SA
    4.0). Plusieurs clichés étant sous CC BY-SA, cette vidéo est diffusée sous licence
    CC BY-SA 4.0.

- id: ciment-3a
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  serie: Ciment
  serie_en: Cement
  numero: 3a/4
  duree: 1 min 54
  couverture: /assets/reels/ciment_3a.jpg
  titre: Brûler autre chose, et ce que ça n'enlève pas
  titre_en: Burning something else, and what it does not remove
  accroche: >-
    Premier levier disponible aujourd'hui : brûler des déchets et de la biomasse
    plutôt que du charbon. 620 kilos de CO₂ deviennent 560 — et la baisse tient à deux
    conventions de comptage, pas à la cheminée. Le CO₂ de la pierre, lui, ne bouge pas.
  accroche_en: >-
    The first lever available today: burn waste and biomass instead of coal. 620
    kilos of CO₂ become 560 — and the drop comes from two accounting conventions, not
    from the stack. The CO₂ from the stone does not move.
  youtube: kDb8I6zdELA
  code:
  sources:
    - >-
      En kgCO₂ par tonne de ciment, émissions directes — 390 de procédé + 230 de
      combustion = 620 ; avec 50 % de combustibles alternatifs, 390 + 170 = 560.
      Valeurs d'ingénierie 2025.
    - >-
      Intensité et part biogénique des combustibles — WBCSD / CSI, Getting the Numbers
      Right, 2016, p. 13 ; objectif de la profession, 95 % de substitution dont 45 % de
      biomasse — ADEME, Plan de transition sectoriel de l'industrie cimentière, 2021,
      tableau 4 p. 34.
    - >-
      Airvault (Heidelberg Materials) — ligne de cuisson neuve mise en service en mai
      2026, jusqu'à 90 % de combustibles alternatifs.
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; vue aérienne IGN / Géoplateforme (Licence Ouverte) et OpenStreetMap (ODbL).
    La couverture reprend des déchets avant broyage (Fun4life.nl, domaine public).
    Plusieurs clichés étant sous CC BY-SA, cette vidéo est diffusée sous licence CC
    BY-SA 4.0.

- id: ciment-3b
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  serie: Ciment
  serie_en: Cement
  numero: 3b/4
  duree: 2 min 06
  couverture: /assets/reels/ciment_3b.jpg
  titre: Moins de clinker, le levier le moins cher
  titre_en: Less clinker, the cheapest lever
  accroche: >-
    Le clinker est la colle du ciment ; le reste du sac peut être autre chose. De
    trois quarts de clinker à la moitié, on tombe à 370 kilos de CO₂ — et ce qui
    freine est sur le chantier et dans le bon de commande avant d'être dans la norme.
  accroche_en: >-
    Clinker is cement's glue; the rest of the bag can be something else. Going from
    three quarters clinker to half brings CO₂ down to 370 kilos — and what holds it
    back is on the building site and in the purchase order before it is in the
    standard.
  youtube: DEPfn2_uuE0
  code:
  sources:
    - >-
      En kgCO₂ par tonne de ciment — 420 sur le seul taux de clinker, 370 cumulé avec
      les combustibles alternatifs, soit environ − 40 % depuis 620 ; plancher de 260,
      la décarbonatation seule à 50 % de clinker.
    - >-
      « Le clinker […] assure la fonction de "colle" » et les freins du chantier et de
      la commande publique — ADEME, Plan de transition sectoriel de l'industrie
      cimentière, 2021, p. 13, 15, 31 et 35.
    - >-
      Xeuilley (Vicat) — argiles calcinées depuis 2024, 15 % des émissions du site ;
      NF EN 197-5 (2021) ; classes GWR du FD P18-483-2 (mars 2025) ; Bournezeau
      (Hoffmann Green) — 250 000 t par an sans four sur le site.
  licence: >-
    Photographies issues de Wikimedia Commons (Lorenzo Bonino, CC BY 3.0 ; Steve
    Pivnick, U.S. Air Force, domaine public) ; vues aériennes IGN / Géoplateforme et
    OpenStreetMap ; schémas dessinés pour la série. La couverture reprend les nodules
    de clinker de Lorenzo Bonino. Aucune photographie sous CC BY-SA : cette vidéo est
    diffusée sous licence CC BY 4.0.

- id: ciment-4a
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  serie: Ciment
  serie_en: Cement
  numero: 4a/4
  duree: 2 min 31
  couverture: /assets/reels/ciment_4a.jpg
  titre: Capter le CO₂ de la pierre
  titre_en: Capturing the CO₂ from the stone
  accroche: >-
    Il reste 370 kilos de CO₂, dont 260 sortent du calcaire : aucun combustible,
    aucune électricité n'y change rien, il faut les capter. Comment on s'y prend, où
    on en est à Brevik, et pourquoi le four électrique ne capte pas mieux la pierre —
    alors qu'un four qui brûle de la biomasse peut passer sous zéro.
  accroche_en: >-
    370 kilos of CO₂ remain, 260 of them from the limestone: no fuel and no
    electricity changes that, it has to be captured. How it is done, where Brevik
    stands, and why the electric kiln captures the stone's CO₂ no better — while a
    kiln burning biomass can go below zero.
  youtube: 6CISOOp7Cjw
  code:
  sources:
    - >-
      En kgCO₂ par tonne de ciment — 370 avant capture, dont 260 de décarbonatation ;
      90 % captés, 37 restent (four à flamme) ; four électrique, 270 avant capture et
      27 après (calculé). Valeurs d'ingénierie 2025.
    - >-
      Le 8 kilos et le passage sous zéro sont calculés — substitut à 85 kgCO₂/GJ dont
      47 % de carbone biogénique, 90 % captés biogénique compris, CO₂ biogénique
      enfoui compté en négatif. Un ordre de grandeur, qui repose sur une convention.
    - >-
      Brevik (Heidelberg Materials) — inauguré le 18 juin 2025, conçu pour 400 000 t
      par an soit 50 % des émissions de l'usine, taux limité par la chaleur perdue
      disponible ; 58 408 t captées en 2025 (rapport annuel 2025, p. 121).
    - >-
      Pilote d'oxycombustion catch4climate, Mergelstetten, inauguré le 8 juillet 2026 ;
      maturité — IEA, Clean Energy Technology Guide, 2026 (amines à captage partiel
      TRL 9, oxycombustion TRL 7).
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; carte Sentinel-2 cloudless 2016 (EOX IT Services, CC BY 4.0) ; schémas
    dessinés pour la série. La couverture reprend l'unité de captage de Brevik
    (PutTheKettleOn, CC BY 4.0). Deux clichés étant sous CC BY-SA, cette vidéo est
    diffusée sous licence CC BY-SA 4.0.

- id: ciment-4b
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  serie: Ciment
  serie_en: Cement
  numero: 4b/4
  duree: 2 min 16
  couverture: /assets/reels/ciment_4b.jpg
  titre: Où part le CO₂ capté
  titre_en: Where captured CO₂ goes
  accroche: >-
    Une fois capté, le CO₂ s'enfouit ou s'utilise. De Brevik, il part en bateau
    puis par 100 km de conduite, 2 600 m sous la mer du Nord. La France n'a pas
    encore de stockage prêt : ce que prévoient Montalieu, Airvault et Lumbres, et
    pourquoi utiliser le CO₂, ce n'est pas le garder.
  accroche_en: >-
    Once captured, CO₂ is either buried or used. From Brevik it is shipped, then
    piped 100 km, 2,600 m under the North Sea. France has no storage site ready
    yet: what Montalieu, Airvault and Lumbres plan, and why using CO₂ is not keeping
    it.
  youtube: dGftH7P1dGE
  code:
  sources:
    - >-
      Northern Lights — bateau de Brevik vers le terminal d'Øygarden depuis juin 2025 ;
      première injection en août 2025 dans le réservoir Aurora, 2 600 m sous le fond,
      au bout d'une conduite de 100 km (Equinor, 25/08/2025). CO₂ dense au-delà
      d'environ 800 m (GIEC, 2005, ch. 5) ; Sleipner, environ 1 Mt par an depuis 1996.
    - >-
      France — aucun site de stockage prêt (Autorité environnementale, avis 2024-75) ;
      Lacq abandonné en octobre 2024 (AFP) ; lauréats de février 2026 aidés 15 ans :
      Montalieu 1,2 Mt/an (Vicat), Airvault 950 kt/an à partir de 2031, dont environ
      20 % biogénique pour du carburant (dossier de presse du gouvernement).
    - >-
      Coût — « doubler le coût du ciment » à Lumbres (Eqiom) ; les 2 000 € par maison
      neuve, environ 1 % de son prix, sont un ordre de grandeur calculé (environ 15 t
      de ciment, 90 à 140 €/t, doublé). Carburant de synthèse : retour à l'air en
      moins d'un an (AIE, 2019).
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; carte et vues aériennes IGN (Licence Ouverte) et OpenStreetMap (ODbL) ;
    schémas dessinés pour la série. La couverture reprend le terminal de Northern
    Lights à Øygarden (Zypres, CC BY-SA 4.0). Les clichés étant sous CC BY-SA, cette
    vidéo est diffusée sous licence CC BY-SA 4.0.

- id: ciment-bonus
  domaine: Industrie
  domaine_en: Industry
  filiere: Ciment
  filiere_en: Cement
  # Hors du compte « /4 » (CHARTE § 1.10) : « Ciment · bonus », pas « 5/4 ».
  serie: Ciment ·
  serie_en: Cement ·
  numero: bonus
  duree: 2 min 22
  couverture: /assets/reels/ciment_bonus.jpg
  titre: Le béton reprend-il son CO₂ ?
  titre_en: Does concrete take its CO₂ back?
  accroche: >-
    Une fois en place, le béton reprend à l'air une partie du CO₂ sorti de la pierre
    dans les fours : près de la moitié depuis un siècle, surtout par le mortier, et
    jamais celui des combustibles. Lentement, et pas sur l'acier des armatures. Ce que
    donnent les procédés qui veulent l'accélérer, de FastCarb à Gennevilliers.
  accroche_en: >-
    Once in place, concrete takes back from the air part of the CO₂ driven out of the
    stone in kilns: nearly half over a century, mostly through mortar, and never the
    fuel's. Slowly, and not near the reinforcing steel. What processes that try to speed
    it up achieve, from FastCarb to Gennevilliers.
  youtube: vbTifegbNTU
  code:
  sources:
    - >-
      Reprise du CO₂ — 21,3 Gt repris de 1928 à 2023, soit environ 46 % du CO₂ de
      procédé (la pierre) émis sur la période, combustibles non compris ; le mortier fait
      48 % de la reprise, le béton 41,5 % (Niu, Andrew, Xi et al., Earth System Science
      Data 17, 2231, 2025 ; Xi et al., Nature Geoscience, 2016, donnaient 43 % sur
      1930-2013).
    - >-
      Vitesse — la profondeur carbonatée croît comme la racine du temps ; béton courant,
      dehors à l'abri de la pluie, environ 4 mm par racine d'année, soit 12,6 mm à 10 ans
      et 28 mm à 50 ans (Lagerblad, CBI 2005, repris dans la norme NF EN 16757).
    - >-
      Injection dans le béton frais — 0,1 à 0,4 % du poids de ciment, dont environ 90 %
      se minéralise, soit moins de 1 % des 620 kg de CO₂ émis par tonne de ciment ; 4 à
      5 % de ciment en moins selon le fabricant (CarbonCure), chiffre non vérifié
      indépendamment.
    - >-
      FastCarb (recommandations d'avril 2024) — démonstrateurs chez Vicat à Créchy et
      LafargeHolcim à Val d'Azergues, fumées à environ 15 % de CO₂ ; sable recyclé 31 à
      39 kg de CO₂ par tonne, gravillon 5 à 12 ; un béton de granulats recyclés carbonatés
      économise jusqu'à 17,4 kg de CO₂ par m³, environ 10 % de son impact.
    - >-
      Gennevilliers — procédé Neustark chez Lafarge Granulats, CO₂ biogénique d'unités de
      biogaz, plus de 1 000 t par an (communiqué du 10/12/2024), annoncé pour 2025, sans
      mise en service publiée. Le « dixième » est un plafond calculé : environ 10 kg de
      CO₂ par tonne de granulat × 1,85 t/m³, rapportés à environ 175 kg de CO₂ par m³ de
      béton.
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; cartes et vues aériennes IGN (Licence Ouverte) et OpenStreetMap (ODbL) ;
    schémas dessinés pour la série. La couverture reprend la Cité radieuse à Marseille
    (Gatotienesueño, CC0). Deux des photos étant sous CC BY-SA, cette vidéo est diffusée
    sous licence CC BY-SA 4.0.

- id: hydrogene-1
  domaine: Industrie
  domaine_en: Industry
  filiere: Hydrogène
  filiere_en: Hydrogen
  serie: Hydrogène
  serie_en: Hydrogen
  numero: 1/5
  duree: 2 min 13
  couverture: /assets/reels/hydrogene_1.jpg
  titre: À quoi sert vraiment l'hydrogène, et comment on le fabrique
  titre_en: What hydrogen is really for, and how it is made
  accroche: >-
    À côté de la raffinerie de Port-Jérôme, une usine dont on ne parle jamais fabrique
    une centaine de tonnes d'hydrogène par jour. Le monde en utilise près de 100
    millions de tonnes par an, surtout pour raffiner du pétrole et faire des engrais —
    les voitures, moins d'un millième. Le vaporeformeur de méthane, organe par organe.
  accroche_en: >-
    Next to the Port-Jérôme refinery, a plant nobody talks about makes around a hundred
    tonnes of hydrogen a day. The world uses nearly 100 million tonnes a year, mostly to
    refine oil and make fertiliser — cars, less than a thousandth. The steam methane
    reformer, part by part.
  youtube: n7LYfnHcmns
  code:
  sources:
    - >-
      Usages et sources — AIE, Global Hydrogen Review 2024, année 2023 : 97 Mt produits
      pour un usage ; raffinage 43 Mt (44 %), ammoniac environ 32 Mt (33 %), méthanol
      environ 16 Mt (17 %), acier par réduction directe environ 5 Mt (6 %), transport
      routier 60 kt. Gaz naturel environ deux tiers, charbon 20 %, sous-produit plus de
      15 % ; bas carbone moins de 1 %.
    - >-
      Port-Jérôme — environ 50 000 Nm³/h d'hydrogène envoyés à la raffinerie voisine pour
      désulfurer les carburants (Air Liquide). « Une centaine de tonnes par jour » est
      calculé : 50 000 × 0,0899 kg/Nm³ ≈ 4,5 t/h, soit environ 108 t/jour à pleine charge.
    - >-
      Procédé — tubes catalytiques à environ 900 °C (CH₄ + H₂O → CO + 3 H₂), conversion
      du CO à 200–400 °C (CO + H₂O → CO₂ + H₂), purification par tamis moléculaire à
      99,9 %. Environ 60 % de l'hydrogène mondial par vaporeformage : ordre de grandeur
      de nos notes de procédés.
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; vue aérienne IGN (Licence Ouverte) et OpenStreetMap (ODbL). La couverture
    reprend la raffinerie de Port-Jérôme vue de Quillebeuf (Gérard, CC BY-SA 4.0). Deux
    des photos étant sous CC BY-SA, cette vidéo est diffusée sous licence CC BY-SA 4.0.

- id: hydrogene-2
  domaine: Industrie
  domaine_en: Industry
  filiere: Hydrogène
  filiere_en: Hydrogen
  serie: Hydrogène
  serie_en: Hydrogen
  numero: 2/5
  duree: 2 min 12
  couverture: /assets/reels/hydrogene_2.jpg
  titre: D'où sortent les 11 kilos de CO₂ d'un kilo d'hydrogène
  titre_en: Where the 11 kilos of CO₂ in a kilo of hydrogen come from
  accroche: >-
    Deux kilos avant même l'usine, 3,3 par la cheminée des brûleurs, et 5,7 écrits dans
    la réaction chimique : le carbone du méthane ressort en CO₂, quel que soit le
    rendement. Comme pour l'acier et le ciment, les deux tiers viennent de la chimie —
    on ne décarbone pas en changeant seulement de combustible.
  accroche_en: >-
    Two kilos before the plant even starts, 3.3 up the burners' stack, and 5.7 written
    into the chemistry: the methane's carbon comes back out as CO₂, whatever the
    efficiency. As for steel and cement, two thirds come from the chemistry — changing
    the fuel alone does not decarbonise it.
  youtube: FzJchU2H_P0
  code:
  sources:
    - >-
      Bilan, en kgCO₂ par kg d'hydrogène, du puits à la sortie de l'usine (fuites de
      méthane à 1,5 %, électricité de l'usine sans émissions) — amont du méthane 2,0,
      brûleurs 3,3, carbone du méthane dans le gaz du procédé 5,7, soit 11,0 (11,19 sur
      le réseau UE-27 de 2023). Dans l'usine seule, 9,0, dont 63 % de chimie. Bilan
      CH₄ + 2 H₂O → CO₂ + 4 H₂ : un carbone entré, un CO₂ sorti.
    - >-
      La cuve de conversion — un seul étage à haute température dans une usine
      d'hydrogène à tamis moléculaire, et le gaz résiduaire de la purification brûlé
      sous les tubes (IEAGHG, rapport 2017-02). Pour le méthanol, le gaz a déjà environ
      50 % d'hydrogène en trop : on ne convertit pas le CO (Casale, brevet EP 2 116 295).
    - >-
      Erratum — la planche filmée indique « ≈ 8 % vol » de CO₂ dans les fumées de la
      cheminée. Sans capture, l'usine de référence n'a qu'une cheminée, à environ 21 %
      de CO₂ (IEAGHG, 2017-02, p. 4-5).
    - >-
      Le même partage ailleurs, hors amont du combustible — haut fourneau, 1,30 t de CO₂
      de procédé et 0,55 de combustion par tonne d'acier (70 / 30) ; ciment, 0,39 et
      0,23 t par tonne (63 / 37). Port-Jérôme : capture par le froid sur le gaz du
      procédé, jusqu'à 100 000 t de CO₂ par an depuis 2015 (Air Liquide).
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; vue aérienne IGN (Licence Ouverte) et OpenStreetMap (ODbL). La couverture
    reprend un vaporeformeur en service à Leuna (Hannob, CC0). L'une des photos étant
    sous CC BY-SA, cette vidéo est diffusée sous licence CC BY-SA 4.0.

- id: hydrogene-3
  domaine: Industrie
  domaine_en: Industry
  filiere: Hydrogène
  filiere_en: Hydrogen
  serie: Hydrogène
  serie_en: Hydrogen
  numero: 3/5
  duree: 2 min 14
  couverture: /assets/reels/hydrogene_3.jpg
  titre: Du SMR à l'ATR, jusqu'où peut-on capter le CO₂ ?
  titre_en: From SMR to ATR, how far can CO₂ capture go?
  accroche: >-
    Sur un vaporeformeur, on capte le CO₂ du procédé, pas celui des brûleurs : il reste
    5,6 kilos, la moitié du problème. Le reformage autotherme supprime les brûleurs et
    descend à 2,65 — quatre fois moins, pas cent. Et ce qui reste vient surtout d'avant
    l'usine : du champ gazier, du transport et des fuites de méthane.
  accroche_en: >-
    On a steam methane reformer, the process CO₂ is captured, not the burners': 5.6
    kilos remain, half the problem. Autothermal reforming does away with the burners
    and gets down to 2.65 — four times less, not a hundred. And what remains comes
    mostly from before the plant: the gas field, transport and methane leaks.
  youtube: dHuEESikf0U
  code:
  sources:
    - >-
      Les voies, en kgCO₂ par kg d'hydrogène, du puits à la sortie de l'usine,
      électricité sans émissions (réseau UE-27 de 2023 entre parenthèses) — vaporeformage
      11,0 (11,19) ; avec capture du gaz du procédé, 5,6 (6,2), soit environ 95 % de ce
      flux et 60 % du CO₂ émis sur le site ; reformage autotherme avec capture à 94 %,
      2,65 (3,47), dont 2,0 d'amont du méthane. Ordres de grandeur de nos notes de
      procédés.
    - >-
      L'amont du gaz — 2,0 kgCO₂e par kg d'hydrogène, avec des fuites de méthane
      supposées à 1,5 %, est une hypothèse plutôt basse : avec l'approvisionnement
      européen moyen décrit par Bauer et al. (Sustainable Energy & Fuels, 2022) et le
      même taux de fuites, on trouverait plutôt 3.
    - >-
      Les sites — Port-Jérôme capte environ 100 000 t de CO₂ par an depuis 2015, vendues
      et non stockées (ACER, 2025). Quest (Alberta, exploité par Shell) capte plus d'un
      million de tonnes par an depuis 2015, stockées dans un aquifère salin. HPP1
      (Stanlow) : reformage autotherme avec capture, 350 MW, environ 600 000 t de CO₂ par
      an, décision d'investissement attendue en 2026.
    - >-
      L'ATR existe — le réacteur autotherme à l'oxygène pur fabrique le gaz de synthèse
      d'usines de méthanol et de carburants de synthèse, par exemple Oryx GTL au Qatar
      depuis 2006 (Topsoe). C'est la production d'hydrogène à fort taux de capture qui
      n'est pas encore démontrée à grande échelle (AIE, Global Hydrogen Review 2026).
  licence: >-
    Photographies issues de Wikimedia Commons, auteur et licence crédités sur chaque
    image ; vue aérienne IGN (Licence Ouverte) et OpenStreetMap (ODbL). La couverture
    reprend une unité de séparation d'air au Creusot (Pressefoto Westfalen AG, CC BY
    3.0). Plusieurs photos étant sous CC BY-SA, cette vidéo est diffusée sous licence
    CC BY-SA 4.0.

- id: hydrogene-4a
  domaine: Industrie
  domaine_en: Industry
  filiere: Hydrogène
  filiere_en: Hydrogen
  serie: Hydrogène
  serie_en: Hydrogen
  numero: 4a/5
  duree: 2 min 35
  couverture: /assets/reels/hydrogene_4a.jpg
  titre: >-
    La pyrolyse du méthane : de l'hydrogène, et du carbone solide
  titre_en: >-
    Methane pyrolysis: hydrogen, and solid carbon
  accroche: >-
    Chauffé sans air, le méthane se casse en hydrogène et en carbone solide : pas de
    CO₂, mais 3 kilos de poudre noire par kilo d'hydrogène. Un quart de méthane de plus
    qu'un vaporeformeur, un carbone qui dépasse vite le marché du noir de carbone — et
    pourtant un précieux usage du gaz pour les pays qui en ont trop. Avec du biogaz,
    une émission négative.
  accroche_en: >-
    Heated without air, methane splits into hydrogen and solid carbon: no CO₂, but 3
    kilos of black powder per kilo of hydrogen. A quarter more methane than a steam
    reformer, carbon that quickly outgrows the carbon black market — and yet a valuable
    use of gas for the countries that have too much of it. With biogas, a negative
    emission.
  youtube: oKW7Cl-uvkQ
  code:
  sources:
    - >-
      Transparence — le procédé plasma a été développé au centre PERSEE de Mines Paris.
      Mines Paris, par Armines, détient des parts de Monolith ; l'auteur n'en détient
      aucune.
    - >-
      Les chiffres, en kgCO₂ par kg d'hydrogène, du puits à la sortie de l'usine — 2,5
      avec une électricité sans émissions (l'amont du gaz du vaporeformage, 2,0, mis à
      l'échelle des 4 kg de méthane de la pyrolyse) ; 8,5 sur le réseau UE-27 de 2023
      (2,5 + 25 kWh × 240 g). Ce sont des calculs, à partir de 25 kWh par kilo :
      Fulcheri (Annales des Mines, 2022) donne 10 à 30 kWh selon les torches.
    - >-
      « Un quart de méthane en plus » — 4 kg de méthane au minimum (CH₄ → C + 2 H₂,
      conversion complète) contre 3,4 kg au vaporeformeur (IEAGHG, 2017), soit + 26 %.
      « Près de 300 millions de tonnes » : 97 Mt d'hydrogène (AIE, Global Hydrogen
      Review 2024) × 2,98 ; marché du noir de carbone, 12 à 14 Mt par an. « Jusqu'à
      11 kg » : 2,98 kg de carbone × 44/12, brut, avant les émissions du biogaz et de
      l'électricité.
    - >-
      « Au moins la moitié des réserves » — la moitié des réserves de gaz pour 2 °C
      (McGlade et Ekins, Nature, 2015), 56 % pour 1,5 °C (Welsby et al., Nature, 2021,
      après correction). Pourquoi « trop de gaz » : le billet « Rupture de stock ? »
      (2024).
    - >-
      Les sites — Monolith : usine Olive Creek, à Hallam (Nebraska), environ 14 000 t de
      noir de carbone par an ; en 2026, elle passe du gaz naturel à une charge
      d'hydrocarbure liquide, et son projet d'ammoniac est remplacé par un centre de
      données. BASF et ExxonMobil : démonstrateur prévu à Baytown, jusqu'à 2 000 t
      d'hydrogène et 6 000 t de carbone par an (annonce du 17/11/2025), chauffé à
      l'électricité, sans plasma. Hazer : démonstrateur sur le biogaz de la station
      d'épuration de Woodman Point, près de Perth, 100 t d'hydrogène par an de capacité ;
      mis en veille après plus de 1 500 heures de marche (ARENA, 2025).
  licence: >-
    Carte des réserves de gaz : BP Statistical Review of World Energy 2021, fond Natural
    Earth. Photographies issues de Wikimedia Commons, auteur et licence crédités sur
    chaque image ; la couverture reprend une pile de pneus (PheobeLongneck, CC0). La
    photo du méthaniseur étant sous CC BY-SA 4.0, cette vidéo est diffusée sous licence
    CC BY-SA 4.0.

- id: hydrogene-4b
  domaine: Industrie
  domaine_en: Industry
  filiere: Hydrogène
  filiere_en: Hydrogen
  serie: Hydrogène
  serie_en: Hydrogen
  numero: 4b/5
  duree: 2 min 33
  couverture: /assets/reels/hydrogene_4b.jpg
  titre: >-
    L'électrolyse : quand l'hydrogène est-il vraiment vert ?
  titre_en: >-
    Electrolysis: when is hydrogen really green?
  accroche: >-
    De l'eau, du courant, et aucun carbone dans l'usine : l'électrolyseur n'émet que ce
    qu'émet son électricité. 53 kWh par kilo d'hydrogène, 38 + 9 de chaleur à haute
    température. Sur le réseau européen moyen, l'hydrogène ressort à 12,7 kg de CO₂ par
    kilo, plus que le vaporeformage qu'il remplace : le seuil est à 210 g par kWh.
  accroche_en: >-
    Water, electricity, and no carbon in the plant: an electrolyser emits only what its
    electricity emits. 53 kWh per kilo of hydrogen, 38 + 9 of heat at high temperature.
    On the average European grid, hydrogen comes out at 12.7 kg of CO₂ per kilo, more
    than the steam reforming it replaces: the threshold is 210 g per kWh.
  youtube: r7WUx2ainUY
  code:
  sources:
    - >-
      Électrolyseur courant (alcalin ou à membrane) : 53 kWh d'électricité par kg
      d'hydrogène, rendement système moyen de l'AIE (Global Hydrogen Review 2025). Le
      kilo d'hydrogène contient 33,3 kWh (pouvoir calorifique inférieur) : 33,3 / 53 =
      63 % (74 % sur le pouvoir calorifique supérieur, 39,4 kWh).
    - >-
      Le seuil — 11,19 / 53 ≈ 210 gCO₂/kWh, où 11,19 kg est le vaporeformage compté sur
      le réseau UE. Trois fois le même électrolyseur : France 2023 à 56 g → 2,97 kg ;
      UE-27 2023 à 240 g → 12,72 ; monde 2023 à 480 g → 25,44, contre 19,5 pour la
      gazéification du charbon. Le 240 g européen date de 2023 et baisse vite : ces
      valeurs sont à redater chaque année.
    - >-
      Haute température (électrolyse à oxyde solide) : cellule en céramique, typiquement
      entre 600 et 900 °C (AIE, guide ETP des technologies) ; 38 kWh d'électricité +
      9 kWh de chaleur par kg, système (DOE, 2024) ; maturité 8 sur 9, contre 9 pour
      l'alcalin et la membrane (AIE, GHR 2026). Démonstrateur MultiPLHY (Sunfire) à la
      raffinerie Neste de Rotterdam : 2,6 MW, plus de 60 kg d'hydrogène par heure,
      démarré le 6 octobre 2025.
    - >-
      Les sites — Normand'Hy (Air Liquide, Port-Jérôme-sur-Seine) : 200 MW à membrane,
      ≈ 28 000 t par an annoncées, raccordé au réseau en juin 2025, production annoncée
      pour 2026. Holland Hydrogen 1 (Shell, Rotterdam) : 200 MW alcalin, raccordé au
      réseau d'hydrogène de Rotterdam en mars 2026, démarrage attendu fin 2026. Chifeng
      (Envision, Mongolie-Intérieure) : 500 MW, en service depuis juillet 2025 (AIE, GHR
      2026). Sources consultées entre le 14 septembre et le 1er octobre 2026.
  licence: >-
    Vue aérienne : orthophoto IGN / Géoplateforme (Licence Ouverte) et emprise
    OpenStreetMap (ODbL). Photographies issues de Wikimedia Commons, auteur et licence
    crédités sur chaque image. Le module d'électrolyse (Bubble60) étant sous CC BY-SA
    4.0, cette vidéo est diffusée sous licence CC BY-SA 4.0.

- id: hydrogene-5a
  domaine: Industrie
  domaine_en: Industry
  filiere: Hydrogène
  filiere_en: Hydrogen
  serie: Hydrogène
  serie_en: Hydrogen
  numero: 5a/5
  duree: 2 min 39
  couverture: /assets/reels/hydrogene_5a.jpg
  titre: >-
    Tuyaux et cavités : à quoi servent les infrastructures de l'hydrogène ?
  titre_en: >-
    Pipes and caverns: what is hydrogen infrastructure for?
  accroche: >-
    Aujourd'hui, l'hydrogène se fabrique là où on l'utilise : ni tuyau, ni réservoir. Un
    électrolyseur qui ne tourne qu'aux heures bon marché — 513 heures de prix négatif en
    France en 2025 — fait un hydrogène moins cher, mais l'usine le veut à toute heure : il
    faut le stocker, par milliers de tonnes, dans des cavités creusées dans le sel, et le
    transporter par canalisations. Pas indispensables, mais elles laissent l'électrolyse
    choisir ses heures.
  accroche_en: >-
    Today, hydrogen is made where it is used: no pipe, no tank. An electrolyser running
    only at cheap hours — 513 hours of negative prices in France in 2025 — makes cheaper
    hydrogen, but the plant wants it at every hour: it has to be stored, by the thousand
    tonnes, in caverns dug into salt, and carried by pipeline. Not indispensable, but they
    let electrolysis choose its hours.
  youtube: znPWw-3k0vI
  code:
  sources:
    - >-
      513 heures de prix négatif en France en 2025 : RTE, Bilan électrique 2025 (EPEX
      SPOT). Avec les prix horaires de 2025 et un électrolyseur à 1 350 €/kW, tourner les
      ≈ 4 300 heures les moins chères donne ≈ 3,5 €/kg contre ≈ 4,6 en continu — un calcul
      simple, qui dépend du coût de l'électrolyseur. Le stock montré (≈ 80 jours de
      consommation de l'usine) est calculé sur les mêmes prix, sans coût ni arrêt.
    - >-
      Le gaz au vaporeformeur plutôt qu'à la centrale : par un cycle combiné (un peu moins
      de 60 % ; record de 62,22 % à Bouchain, homologué en 2016) puis l'électrolyse (63 %),
      ≈ 37 % de l'énergie du gaz finit en hydrogène ; directement au vaporeformeur, ≈ 76 %.
    - >-
      Manosque (projet GeoH2, Géométhane) : deux cavités salines existantes, non
      exploitées, voisines des cavités de gaz naturel ; ≈ 6 000 t d'hydrogène, à plus de
      1 000 m et près de 200 bars ; mise en service visée en 2031 (dossier du débat public,
      mars 2025 ; décision du maître d'ouvrage, 11/12/2025).
    - >-
      Canalisations : 1 636 km d'hydrogène en service dans l'UE (ACER, 2025). HY-FEN
      (NaTran) : plus de 800 km de Fos-sur-Mer à la frontière allemande, ≈ 2 Mt/an, service
      visé en 2032, décision d'investissement non prise. Volume : 10,8 MJ/Nm³ pour
      l'hydrogène contre 35,8 pour le méthane (NIST), rapport 3,3 ; à rapport de pression
      égal, ≈ 3,3 fois le travail de compression par unité d'énergie (Haeseldonckx et
      D'haeseleer, Int. J. Hydrogen Energy, 2007).
    - >-
      La valeur de la cavité vient de travaux en cours (MINES Paris – PSL), non encore
      publiés, sur Fos-sur-Mer et la cavité de Manosque : quand l'hydrogène doit venir de
      l'électrolyse, la cavité réduit son coût d'environ 11 % dans le cas central, de 5 à
      16 % selon l'année météo — un ordre de grandeur. Sources consultées entre le 2 et le
      4 octobre 2026.
  licence: >-
    Vues aériennes : orthophoto IGN / Géoplateforme (Licence Ouverte) et Sentinel-2
    cloudless 2016 d'EOX (CC BY 4.0). Photographies issues de Wikimedia Commons, auteur et
    licence crédités sur chaque image ; pictogrammes Tabler Icons (MIT). Cette vidéo est
    diffusée sous licence CC BY-SA 4.0, comme toute la série.
