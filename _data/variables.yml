default:
  text_skin: default
  highlight_theme: default
  lang: fr
  paths:
    root: /
    home: /
    archive:  /archive.html
    rss:  /feed.xml
  mathjax: true
  mathjax_autoNumber: false
  mermaid: false
  chart: false
  toc:
    selectors: 'h1,h2,h3'
  sources: bootcdn

  page:
    mode: normal
    type: article
    article_header:
      align: left
      theme: light
    articles:
      show_cover: true
      show_excerpt: true
      show_readmore: true
      show_info: false
    show_title: true
    show_edit_on_github: false
    show_date: true
    show_tags: true
    show_author_profile: false
    show_subscribe: true
    full_width: false
    sharing: true
    comment: true
    license: false
    pageview: false
    search: default

## cdn.bootcss.com remplacé par jsDelivr (mêmes versions) le 2026-09-30 : ce domaine a été
## repris en 2024 par l'opérateur de l'attaque polyfill.io (Funnull), qui y injectait du code.
sources:
  bootcdn:
    font_awesome: 'https://use.fontawesome.com/releases/v5.0.13/css/all.css'
    jquery: 'https://cdn.jsdelivr.net/npm/jquery@3.1.1/dist/jquery.min.js'
    leancloud_js_sdk: '//cdn.jsdelivr.net/npm/leancloud-storage@3.13.2/dist/av-min.js'
    chart: 'https://cdn.jsdelivr.net/npm/chart.js@2.7.2/dist/Chart.bundle.min.js'
    gitalk:
      js: 'https://cdn.jsdelivr.net/npm/gitalk@1.2.2/dist/gitalk.min.js'
      css: 'https://cdn.jsdelivr.net/npm/gitalk@1.2.2/dist/gitalk.css'
    valine: 'https://unpkg.com/valine/dist/Valine.min.js' # bootcdn not available
    mathjax: 'https://cdn.jsdelivr.net/npm/mathjax@2.7.4/MathJax.js?config=TeX-MML-AM_CHTML'
    mermaid: 'https://cdn.jsdelivr.net/npm/mermaid@8.0.0-rc.8/dist/mermaid.min.js'
  unpkg:
    font_awesome: 'https://use.fontawesome.com/releases/v5.0.13/css/all.css'
    jquery: 'https://unpkg.com/jquery@3.3.1/dist/jquery.min.js'
    leancloud_js_sdk: '//cdn.jsdelivr.net/npm/leancloud-storage@3.13.2/dist/av-min.js'
    chart: 'https://unpkg.com/chart.js@2.7.2/dist/Chart.min.js'
    gitalk:
      js: 'https://unpkg.com/gitalk@1.2.2/dist/gitalk.min.js'
      css: 'https://unpkg.com/gitalk@1.2.2/dist/gitalk.css'
    valine: 'https//unpkg.com/valine/dist/Valine.min.js'
    mathjax: 'https://unpkg.com/mathjax@2.7.4/unpacked/MathJax.js?config=TeX-MML-AM_CHTML'
    mermaid: 'https://unpkg.com/mermaid@8.0.0-rc.8/dist/mermaid.min.js'
